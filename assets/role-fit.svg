      <rect x="915" y="218" width="225" height="28" rx="14" fill="#1C3D66"/><text x="931" y="237">Advanced DAX measure libraries</text>
      <rect x="915" y="254" width="225" height="28" rx="14" fill="#1C3D66"/><text x="931" y="273">Direct Lake · TMDL · .pbip</text>
      <rect x="915" y="290" width="225" height="28" rx="14" fill="#1C3D66"/><text x="931" y="309">Tabular Editor · DAX Studio</text>
      <rect x="915" y="326" width="225" height="28" rx="14" fill="#1C3D66"/><text x="931" y="345">Self-service BI semantic layers</text>
      <rect x="915" y="362" width="225" height="28" rx="14" fill="#1C3D66"/><text x="931" y="381">Executive dashboard UX</text>
