<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
            .chip { font-size: 12.5px; fill: #E6EEF8; }
    </style>
  </defs>
  <rect width="1200" height="470" rx="18" fill="#0B1B33"/>
  <text x="40" y="46" fill="#9CC9F0" font-size="14" letter-spacing="3" font-weight="600">ROLE-FIT MAP</text>
  <text x="40" y="74" fill="#FFFFFF" font-size="22" font-weight="700">One profile, four roles — what I bring to each</text>

  <!-- Card template: 270 wide, gap 20, start x=40 -->
  <!-- 1 Data Architect -->
  <g>
    <rect x="40" y="100" width="265" height="340" rx="14" fill="#12294A" stroke="#2F5D8F"/>
    <rect x="40" y="100" width="265" height="6" rx="3" fill="#5BA4E6"/>
    <text x="60" y="140" fill="#FFFFFF" font-size="18" font-weight="700">Data Architect</text>
    <text x="60" y="162" fill="#7FA6CF" font-size="12">Model the business, govern the data</text>
    <g class="chip">
      <rect x="60" y="182" width="225" height="28" rx="14" fill="#1C3D66"/><text x="76" y="201">Dimensional / star-schema modeling</text>
      <rect x="60" y="218" width="225" height="28" rx="14" fill="#1C3D66"/><text x="76" y="237">Data Vault 2.0</text>
      <rect x="60" y="254" width="225" height="28" rx="14" fill="#1C3D66"/><text x="76" y="273">SCD Type 1 / Type 2</text>
      <rect x="60" y="290" width="225" height="28" rx="14" fill="#1C3D66"/><text x="76" y="309">Master Data Mgmt (Prospecta)</text>
      <rect x="60" y="326" width="225" height="28" rx="14" fill="#1C3D66"/><text x="76" y="345">Data quality &amp; governance</text>
      <rect x="60" y="362" width="225" height="28" rx="14" fill="#1C3D66"/><text x="76" y="381">ERD · Visio · draw.io · Lucidchart</text>
    </g>
  </g>

  <!-- 2 Solution / Technical Architect -->
