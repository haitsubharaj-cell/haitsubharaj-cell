    <text x="630" y="162" fill="#7FA6CF" font-size="12">Build reliable pipelines</text>
    <g class="chip">
      <rect x="630" y="182" width="225" height="28" rx="14" fill="#1C3D66"/><text x="646" y="201">Advanced SQL · Spark SQL — 9 yrs</text>
      <rect x="630" y="218" width="225" height="28" rx="14" fill="#1C3D66"/><text x="646" y="237">Python ETL automation — 9+ yrs</text>
      <rect x="630" y="254" width="225" height="28" rx="14" fill="#1C3D66"/><text x="646" y="273">Snowflake</text>
      <rect x="630" y="290" width="225" height="28" rx="14" fill="#1C3D66"/><text x="646" y="309">Fabric Lakehouse · Dataflows Gen2</text>
      <rect x="630" y="326" width="225" height="28" rx="14" fill="#1C3D66"/><text x="646" y="345">Power Query (M) transformations</text>
      <rect x="630" y="362" width="225" height="28" rx="14" fill="#1C3D66"/><text x="646" y="381">Data cleaning &amp; validation pipelines</text>
