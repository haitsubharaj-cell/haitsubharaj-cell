    <rect x="325" y="100" width="265" height="6" rx="3" fill="#7FB6EA"/>
    <text x="345" y="140" fill="#FFFFFF" font-size="18" font-weight="700">Solution Architect</text>
    <text x="345" y="162" fill="#7FA6CF" font-size="12">Technical design, end to end</text>
    <g class="chip">
      <rect x="345" y="182" width="225" height="28" rx="14" fill="#1C3D66"/><text x="361" y="201">Medallion lakehouse design</text>
      <rect x="345" y="218" width="225" height="28" rx="14" fill="#1C3D66"/><text x="361" y="237">Microsoft Fabric architecture</text>
      <rect x="345" y="254" width="225" height="28" rx="14" fill="#1C3D66"/><text x="361" y="273">Azure Data Factory · Synapse</text>
      <rect x="345" y="290" width="225" height="28" rx="14" fill="#1C3D66"/><text x="361" y="309">Solution design docs &amp; ADRs</text>
