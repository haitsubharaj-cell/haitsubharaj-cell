<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="rail" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="1140" y2="0">
      <stop offset="0" stop-color="#2F5D8F"/>
      <stop offset="0.75" stop-color="#5BA4E6"/>
      <stop offset="1" stop-color="#9CC9F0"/>
    </linearGradient>
    
  </defs>

  <rect width="1200" height="360" rx="18" fill="#0B1B33"/>
  <text x="40" y="46" fill="#9CC9F0" font-size="14" letter-spacing="3" font-weight="600">CAREER JOURNEY</text>
  <text x="40" y="74" fill="#FFFFFF" font-size="22" font-weight="700">Finance → BI → Master Data → Architecture</text>

  <line x1="60" y1="200" x2="1140" y2="200" stroke="url(#rail)" stroke-width="4" stroke-linecap="round"/>

  <!-- 2011-14 education -->
  <g>
    <circle cx="110" cy="200" r="9" fill="#0B1B33" stroke="#7FA6CF" stroke-width="3"/>
    <text x="110" y="168" text-anchor="middle" fill="#7FA6CF" font-size="13" font-weight="600">2011 – 2014</text>
    <text x="110" y="238" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">Commerce &amp; Accounts</text>
    <text x="110" y="258" text-anchor="middle" fill="#B8CCE4" font-size="12">B.Com, Univ. of Calcutta</text>
    <text x="110" y="276" text-anchor="middle" fill="#B8CCE4" font-size="12">Diploma, Industrial</text>
    <text x="110" y="292" text-anchor="middle" fill="#B8CCE4" font-size="12">Company Accounts</text>
  </g>

  <!-- 2015-2025 Sabyasachi : span bar -->
  <g>
    <rect x="230" y="190" width="520" height="20" rx="10" fill="#1C3D66" stroke="#5BA4E6"/>
    <text x="490" y="168" text-anchor="middle" fill="#9CC9F0" font-size="13" font-weight="600">Jun 2015 – Sep 2025 · 10 years</text>
    <text x="490" y="238" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">Sabyasachi Calcutta LLP — MDM Associate / Senior Power BI Developer</text>
    <text x="490" y="260" text-anchor="middle" fill="#B8CCE4" font-size="12">Enterprise BI reporting · Power BI &amp; DAX · SQL · Python ETL automation</text>
    <text x="490" y="278" text-anchor="middle" fill="#B8CCE4" font-size="12">Master data governance on Prospecta · HR / SAP SuccessFactors master data</text>
    <text x="490" y="296" text-anchor="middle" fill="#B8CCE4" font-size="12">Star schemas, SCD Type 1/2, data-quality rules</text>
  </g>

  <!-- 2025-26 Bajaj -->
  <g>
    <circle cx="830" cy="200" r="9" fill="#0B1B33" stroke="#7FA6CF" stroke-width="3"/>
    <text x="830" y="140" text-anchor="middle" fill="#7FA6CF" font-size="13" font-weight="600">Sep 2025 – Feb 2026</text>
    <text x="830" y="160" text-anchor="middle" fill="#B8CCE4" font-size="12">Insurance Consultant</text>
    <text x="830" y="176" text-anchor="middle" fill="#B8CCE4" font-size="12">Bajaj Life Insurance</text>
  </g>

  <!-- 2026 Hexaware -->
  <g>
    <circle cx="960" cy="200" r="10" fill="#5BA4E6" stroke="#FFFFFF" stroke-width="2"/>
    <text x="960" y="238" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">Technical Architect</text>
    <text x="960" y="258" text-anchor="middle" fill="#B8CCE4" font-size="12">Hexaware Technologies</text>
    <text x="960" y="276" text-anchor="middle" fill="#B8CCE4" font-size="12">Bengaluru · May – Aug 2026</text>
    <text x="960" y="168" text-anchor="middle" fill="#9CC9F0" font-size="13" font-weight="600">2026</text>
  </g>

  <!-- Now -->
  <g>
    <circle cx="1110" cy="200" r="9" fill="#9CC9F0"><animate attributeName="r" values="9;14;9" dur="2s" repeatCount="indefinite"/></circle>
    <text x="1110" y="168" text-anchor="middle" fill="#9CC9F0" font-size="13" font-weight="700">NOW</text>
    <text x="1110" y="238" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">Open to</text>
    <text x="1110" y="256" text-anchor="middle" fill="#B8CCE4" font-size="12">Data / Solution</text>
    <text x="1110" y="272" text-anchor="middle" fill="#B8CCE4" font-size="12">Architect &amp;</text>
    <text x="1110" y="288" text-anchor="middle" fill="#B8CCE4" font-size="12">Data Engineer</text>
  </g>

  <text x="40" y="340" fill="#5E7FA3" font-size="12">★ Recognised by LearnTube.ai among the Top 1000 Professionals in India (2026)</text>
</svg>
